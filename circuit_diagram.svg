<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" width="1100" height="680" font-family="Inter, Segoe UI, Arial, sans-serif">
  <rect width="1100" height="680" fill="#f8fafc"/>

  <!-- Title -->
  <text x="550" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">
    Intelligent Pothole Warning Road — Circuit Diagram (Arduino UNO + Buzzer)
  </text>
  <text x="550" y="60" text-anchor="middle" font-size="13" fill="#475569">
    IR Sensor (D2) • Buzzer (D6) • Red LED (D7) • Green LED (D8) • SG90 Servo (D9) • Common 5V &amp; GND Breadboard Rails
  </text>

  <!-- 5V Power Bank -->
  <g transform="translate(40, 470)">
    <rect width="160" height="90" rx="10" fill="#1e293b" stroke="#0f172a" stroke-width="2"/>
    <rect x="150" y="30" width="14" height="30" rx="3" fill="#94a3b8"/>
    <text x="80" y="40" text-anchor="middle" font-size="14" font-weight="700" fill="#f8fafc">5V Power Bank</text>
    <text x="80" y="62" text-anchor="middle" font-size="12" fill="#cbd5e1">USB Output (5V)</text>
  </g>

  <!-- USB Cable from Power Bank to Arduino USB-B -->
  <path d="M 204 515 L 235 515 L 235 305 L 265 305" fill="none" stroke="#334155" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="220" y="410" font-size="11" font-weight="600" fill="#334155" transform="rotate(-90 220 410)">USB Cable (5V Power)</text>

  <!-- Arduino UNO -->
  <g transform="translate(270, 220)">
    <rect width="260" height="260" rx="12" fill="#0284c7" stroke="#0369a1" stroke-width="3"/>
    <!-- USB-B Port -->
    <rect x="-12" y="60" width="36" height="50" rx="3" fill="#cbd5e1" stroke="#64748b" stroke-width="2"/>
    <text x="34" y="90" font-size="11" font-weight="600" fill="#e0f2fe">USB-B</text>
    <!-- DC Barrel Jack -->
    <rect x="-10" y="185" width="34" height="36" rx="3" fill="#1e293b"/>

    <!-- Board Title -->
    <text x="135" y="128" text-anchor="middle" font-size="18" font-weight="800" fill="#ffffff">ARDUINO</text>
    <text x="135" y="150" text-anchor="middle" font-size="16" font-weight="700" fill="#bae6fd">UNO R3</text>

    <!-- Top Digital Pins Header -->
    <rect x="60" y="8" width="185" height="28" rx="4" fill="#0f172a"/>
    <text x="82" y="26" text-anchor="middle" font-size="11" font-weight="700" fill="#38bdf8">D9</text>
    <text x="118" y="26" text-anchor="middle" font-size="11" font-weight="700" fill="#4ade80">D8</text>
    <text x="154" y="26" text-anchor="middle" font-size="11" font-weight="700" fill="#f87171">D7</text>
    <text x="190" y="26" text-anchor="middle" font-size="11" font-weight="700" fill="#c084fc">D6</text>
    <text x="226" y="26" text-anchor="middle" font-size="11" font-weight="700" fill="#60a5fa">D2</text>

    <!-- Bottom Power Pins Header -->
    <rect x="75" y="224" width="140" height="28" rx="4" fill="#0f172a"/>
    <text x="108" y="242" text-anchor="middle" font-size="11" font-weight="700" fill="#ef4444">5V</text>
    <text x="150" y="242" text-anchor="middle" font-size="11" font-weight="700" fill="#94a3b8">GND</text>
    <text x="192" y="242" text-anchor="middle" font-size="11" font-weight="700" fill="#64748b">VIN</text>
  </g>

  <!-- IR Sensor Module -->
  <g transform="translate(80, 95)">
    <rect width="145" height="95" rx="8" fill="#1d4ed8" stroke="#1e3a8a" stroke-width="2"/>
    <circle cx="32" cy="24" r="10" fill="#0f172a" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="62" cy="24" r="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
    <text x="90" y="45" font-size="13" font-weight="700" fill="#ffffff">IR Sensor</text>
    <text x="90" y="61" font-size="10" fill="#bfdbfe">Obstacle Mod.</text>
    <!-- Pins -->
    <rect x="15" y="72" width="115" height="20" rx="3" fill="#0f172a"/>
    <text x="35" y="86" text-anchor="middle" font-size="10" font-weight="700" fill="#ef4444">VCC</text>
    <text x="72" y="86" text-anchor="middle" font-size="10" font-weight="700" fill="#94a3b8">GND</text>
    <text x="110" y="86" text-anchor="middle" font-size="10" font-weight="700" fill="#60a5fa">OUT</text>
  </g>

  <!-- SG90 Servo Motor -->
  <g transform="translate(300, 85)">
    <rect width="130" height="85" rx="8" fill="#2563eb" stroke="#1e40af" stroke-width="2"/>
    <circle cx="36" cy="34" r="18" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <rect x="33" y="10" width="6" height="28" rx="2" fill="#e2e8f0" stroke="#64748b"/>
    <text x="86" y="34" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">SG90</text>
    <text x="86" y="50" text-anchor="middle" font-size="12" font-weight="600" fill="#dbeafe">Servo</text>
    <rect x="18" y="62" width="95" height="20" rx="3" fill="#0f172a"/>
    <text x="36" y="76" text-anchor="middle" font-size="10" font-weight="700" fill="#ef4444">VCC</text>
    <text x="66" y="76" text-anchor="middle" font-size="10" font-weight="700" fill="#94a3b8">GND</text>
    <text x="96" y="76" text-anchor="middle" font-size="10" font-weight="700" fill="#fb923c">SIG</text>
  </g>

  <!-- Breadboard -->
  <g transform="translate(595, 360)">
    <rect width="465" height="190" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2.5"/>
    <!-- Top Power Rails -->
    <line x1="20" y1="22" x2="445" y2="22" stroke="#ef4444" stroke-width="3"/>
    <text x="10" y="26" font-size="13" font-weight="800" fill="#ef4444">+</text>
    <line x1="20" y1="42" x2="445" y2="42" stroke="#1e293b" stroke-width="3"/>
    <text x="10" y="46" font-size="14" font-weight="800" fill="#1e293b">-</text>

    <!-- Terminal Grid Illustration -->
    <rect x="20" y="60" width="425" height="38" rx="4" fill="#f1f5f9"/>
    <rect x="20" y="106" width="425" height="38" rx="4" fill="#f1f5f9"/>
    <text x="232" y="84" text-anchor="middle" font-size="12" font-weight="600" fill="#64748b">Breadboard Terminal Strips (Component Connections)</text>
    <text x="232" y="130" text-anchor="middle" font-size="11" fill="#94a3b8">Each vertical 5-pin column is internally connected</text>

    <!-- Bottom Power Rails -->
    <line x1="20" y1="160" x2="445" y2="160" stroke="#ef4444" stroke-width="3"/>
    <text x="10" y="164" font-size="13" font-weight="800" fill="#ef4444">+5V</text>
    <line x1="20" y1="178" x2="445" y2="178" stroke="#1e293b" stroke-width="3"/>
    <text x="10" y="182" font-size="12" font-weight="800" fill="#1e293b">GND</text>
  </g>

  <!-- Red LED + 220 Ohm Resistor -->
  <g transform="translate(615, 115)">
    <circle cx="35" cy="25" r="18" fill="#ef4444" stroke="#991b1b" stroke-width="2"/>
    <text x="35" y="30" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">RED</text>
    <text x="35" y="60" text-anchor="middle" font-size="12" font-weight="700" fill="#b91c1c">Red LED</text>
    <text x="18" y="80" font-size="10" font-weight="700" fill="#dc2626">+ (Anode)</text>
    <text x="58" y="80" font-size="10" font-weight="700" fill="#334155">- (Cathode)</text>
    <!-- 220 Ohm Resistor -->
    <rect x="6" y="120" width="24" height="50" rx="5" fill="#fde68a" stroke="#b45309" stroke-width="2"/>
    <line x1="6" y1="132" x2="30" y2="132" stroke="#dc2626" stroke-width="3"/>
    <line x1="6" y1="142" x2="30" y2="142" stroke="#dc2626" stroke-width="3"/>
    <line x1="6" y1="152" x2="30" y2="152" stroke="#78350f" stroke-width="3"/>
    <text x="18" y="184" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e">220Ω</text>
  </g>

  <!-- Green LED + 220 Ohm Resistor -->
  <g transform="translate(760, 115)">
    <circle cx="35" cy="25" r="18" fill="#22c55e" stroke="#166534" stroke-width="2"/>
    <text x="35" y="30" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">GRN</text>
    <text x="35" y="60" text-anchor="middle" font-size="12" font-weight="700" fill="#15803d">Green LED</text>
    <text x="18" y="80" font-size="10" font-weight="700" fill="#16a34a">+ (Anode)</text>
    <text x="58" y="80" font-size="10" font-weight="700" fill="#334155">- (Cathode)</text>
    <!-- 220 Ohm Resistor -->
    <rect x="6" y="120" width="24" height="50" rx="5" fill="#fde68a" stroke="#b45309" stroke-width="2"/>
    <line x1="6" y1="132" x2="30" y2="132" stroke="#dc2626" stroke-width="3"/>
    <line x1="6" y1="142" x2="30" y2="142" stroke="#dc2626" stroke-width="3"/>
    <line x1="6" y1="152" x2="30" y2="152" stroke="#78350f" stroke-width="3"/>
    <text x="18" y="184" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e">220Ω</text>
  </g>

  <!-- 5V Active Buzzer -->
  <g transform="translate(915, 115)">
    <circle cx="55" cy="40" r="34" fill="#1e293b" stroke="#0f172a" stroke-width="3"/>
    <circle cx="55" cy="40" r="10" fill="#475569"/>
    <text x="55" y="92" text-anchor="middle" font-size="13" font-weight="700" fill="#581c87">5V Buzzer</text>
    <text x="32" y="110" text-anchor="middle" font-size="11" font-weight="700" fill="#7e22ce">+ (Signal)</text>
    <text x="82" y="110" text-anchor="middle" font-size="11" font-weight="700" fill="#334155">- (GND)</text>
  </g>

  <!-- ==================== WIRING ==================== -->

  <!-- Breadboard Rail Bridges (connect top +5V/GND rails to bottom +5V/GND rails) -->
  <path d="M 1025 382 L 1025 520" fill="none" stroke="#ef4444" stroke-width="2.5"/>
  <path d="M 1038 402 L 1038 538" fill="none" stroke="#1e293b" stroke-width="2.5"/>

  <!-- Power: Arduino 5V -> Breadboard +5V Rail -->
  <path d="M 378 472 L 378 520 L 615 520" fill="none" stroke="#ef4444" stroke-width="3"/>
  <!-- Power: Arduino GND -> Breadboard GND Rail -->
  <path d="M 420 472 L 420 538 L 615 538" fill="none" stroke="#1e293b" stroke-width="3"/>

  <!-- IR Sensor Wiring -->
  <!-- IR VCC -> Breadboard +5V -->
  <path d="M 115 190 L 115 585 L 650 585 L 650 520" fill="none" stroke="#ef4444" stroke-width="2.5"/>
  <!-- IR GND -> Breadboard GND -->
  <path d="M 152 190 L 152 605 L 675 605 L 675 538" fill="none" stroke="#1e293b" stroke-width="2.5"/>
  <!-- IR OUT -> Arduino D2 -->
  <path d="M 190 190 L 190 205 L 496 205 L 496 228" fill="none" stroke="#2563eb" stroke-width="3"/>

  <!-- Servo Wiring -->
  <!-- Servo VCC -> Breadboard +5V -->
  <path d="M 336 170 L 336 185 L 555 185 L 555 382 L 615 382" fill="none" stroke="#ef4444" stroke-width="2.5"/>
  <!-- Servo GND -> Breadboard GND -->
  <path d="M 366 170 L 366 178 L 570 178 L 570 402 L 615 402" fill="none" stroke="#1e293b" stroke-width="2.5"/>
  <!-- Servo SIG -> Arduino D9 -->
  <path d="M 396 170 L 396 195 L 352 195 L 352 228" fill="none" stroke="#f97316" stroke-width="3"/>

  <!-- Red LED Wiring -->
  <!-- Red LED + -> 220R -> Arduino D7 -->
  <path d="M 633 158 L 633 235" fill="none" stroke="#dc2626" stroke-width="2.5"/>
  <path d="M 633 285 L 633 325 L 424 325 L 424 228" fill="none" stroke="#dc2626" stroke-width="3"/>
  <!-- Red LED - -> Breadboard GND Rail -->
  <path d="M 668 158 L 668 402" fill="none" stroke="#1e293b" stroke-width="2.5"/>

  <!-- Green LED Wiring -->
  <!-- Green LED + -> 220R -> Arduino D8 -->
  <path d="M 778 158 L 778 235" fill="none" stroke="#16a34a" stroke-width="2.5"/>
  <path d="M 778 285 L 778 340 L 388 340 L 388 228" fill="none" stroke="#16a34a" stroke-width="3"/>
  <!-- Green LED - -> Breadboard GND Rail -->
  <path d="M 813 158 L 813 402" fill="none" stroke="#1e293b" stroke-width="2.5"/>

  <!-- Buzzer Wiring -->
  <!-- Buzzer + -> Arduino D6 -->
  <path d="M 947 228 L 947 352 L 460 352 L 460 228" fill="none" stroke="#9333ea" stroke-width="3"/>
  <!-- Buzzer - -> Breadboard GND Rail -->
  <path d="M 997 228 L 997 402" fill="none" stroke="#1e293b" stroke-width="2.5"/>

  <!-- Wire Legend -->
  <g transform="translate(40, 622)">
    <rect width="1020" height="42" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <circle cx="28" cy="21" r="6" fill="#ef4444"/><text x="40" y="25" font-size="12" fill="#334155">+5V Power</text>
    <circle cx="145" cy="21" r="6" fill="#1e293b"/><text x="157" y="25" font-size="12" fill="#334155">GND (Common)</text>
    <circle cx="280" cy="21" r="6" fill="#2563eb"/><text x="292" y="25" font-size="12" fill="#334155">D2: IR Sensor OUT</text>
    <circle cx="445" cy="21" r="6" fill="#9333ea"/><text x="457" y="25" font-size="12" fill="#334155">D6: Buzzer (+)</text>
    <circle cx="585" cy="21" r="6" fill="#dc2626"/><text x="597" y="25" font-size="12" fill="#334155">D7: Red LED (+)</text>
    <circle cx="725" cy="21" r="6" fill="#16a34a"/><text x="737" y="25" font-size="12" fill="#334155">D8: Green LED (+)</text>
    <circle cx="880" cy="21" r="6" fill="#f97316"/><text x="892" y="25" font-size="12" fill="#334155">D9: Servo SIG</text>
  </g>
</svg>
